<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">YOUR IDEAS, IN ONE PLACE</p>
      <h1>Notes App</h1>
      <p>Write a note and find it whenever you need it.</p>
    </header>

    <section class="editor" aria-labelledby="form-heading">
      <h2 id="form-heading">New note</h2>

      <form id="note-form">
        <label for="title">Title</label>
        <input
          id="title"
          type="text"
          placeholder="Give your note a title"
          maxlength="80"
          required
        >

        <label for="content">Note</label>
        <textarea
          id="content"
          rows="5"
          placeholder="Start writing..."
          required
        ></textarea>

        <div class="form-actions">
          <button id="save-button" type="submit">Save note</button>
          <button id="cancel-button" type="button" hidden>
            Cancel editing
          </button>
        </div>
      </form>
    </section>

    <section class="notes-section" aria-labelledby="notes-heading">
      <div class="section-heading">
        <div>
          <h2 id="notes-heading">My notes</h2>
          <p id="note-count">0 notes</p>
        </div>

        <input
          id="search"
          type="search"
          placeholder="Search notes..."
          aria-label="Search notes"
        >
      </div>

      <p id="empty-message" class="empty-message"></p>
      <div id="notes-list" class="notes-grid"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "my-notes-app";

    const form = document.querySelector("#note-form");
    const titleInput = document.querySelector("#title");
    const contentInput = document.querySelector("#content");
    const searchInput = document.querySelector("#search");
    const notesList = document.querySelector("#notes-list");
    const cancelButton = document.querySelector("#cancel-button");

    let editingId = null;
    let notes = [];

    try {
      const savedNotes = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(savedNotes)) notes = savedNotes;
    } catch {
      notes = [];
    }

    function saveNotes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function resetForm() {
      form.reset();
      editingId = null;
      document.querySelector("#form-heading").textContent = "New note";
      document.querySelector("#save-button").textContent = "Save note";
      cancelButton.hidden = true;
    }

    function formatDate(timestamp) {
      return new Date(timestamp).toLocaleDateString("en-NG", {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }

    function renderNotes() {
      notesList.replaceChildren();

      const query = searchInput.value.trim().toLowerCase();
      const visibleNotes = notes
        .filter(note =>
          note.title.toLowerCase().includes(query) ||
          note.content.toLowerCase().includes(query)
        )
        .sort((a, b) => b.updatedAt - a.updatedAt);

      document.querySelector("#note-count").textContent =
        `${notes.length} ${notes.length === 1 ? "note" : "notes"}`;

      const emptyMessage = document.querySelector("#empty-message");
      emptyMessage.textContent = notes.length
        ? "No notes match your search."
        : "No notes yet. Write your first note above.";
      emptyMessage.hidden = visibleNotes.length > 0;

      visibleNotes.forEach(note => {
        const card = document.createElement("article");
        card.className = "note-card";

        const heading = document.createElement("h3");
        heading.textContent = note.title;

        const body = document.createElement("p");
        body.className = "note-content";
        body.textContent = note.content;

        const date = document.createElement("small");
        date.textContent = `Updated ${formatDate(note.updatedAt)}`;

        const actions = document.createElement("div");
        actions.className = "note-actions";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.textContent = "Edit";
        editButton.addEventListener("click", () => {
          editingId = note.id;
          titleInput.value = note.title;
          contentInput.value = note.content;
          document.querySelector("#form-heading").textContent = "Edit note";
          document.querySelector("#save-button").textContent = "Update note";
          cancelButton.hidden = false;
          titleInput.focus();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-button";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", () => {
          if (!confirm(`Delete "${note.title}"?`)) return;

          notes = notes.filter(item => item.id !== note.id);
          if (editingId === note.id) resetForm();
          saveNotes();
          renderNotes();
        });

        actions.append(editButton, deleteButton);
        card.append(heading, body, date, actions);
        notesList.append(card);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const title = titleInput.value.trim();
      const content = contentInput.value.trim();

      if (!title || !content) return;

      if (editingId !== null) {
        const note = notes.find(item => item.id === editingId);
        if (note) {
          note.title = title;
          note.content = content;
          note.updatedAt = Date.now();
        }
      } else {
        notes.push({
          id: `${Date.now()}-${Math.random()}`,
          title,
          content,
          updatedAt: Date.now()
        });
      }

      saveNotes();
      resetForm();
      renderNotes();
    });

    cancelButton.addEventListener("click", resetForm);
    searchInput.addEventListener("input", renderNotes);

    renderNotes();
  </script>
</body>
</html>
