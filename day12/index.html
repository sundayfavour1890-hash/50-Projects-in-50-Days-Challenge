<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">PERSONAL FINANCE</p>
      <h1>Expense Tracker</h1>
      <p>Keep track of where your money goes.</p>
    </header>

    <section class="total-card" aria-label="Total expenses">
      <span>Total spent</span>
      <strong id="total">₦0.00</strong>
      <small id="expense-count">0 expenses</small>
    </section>

    <section class="panel">
      <h2>Add an expense</h2>

      <form id="expense-form">
        <div class="field">
          <label for="description">Description</label>
          <input
            id="description"
            type="text"
            placeholder="e.g. Groceries"
            maxlength="60"
            required
          >
        </div>

        <div class="form-row">
          <div class="field">
            <label for="amount">Amount (₦)</label>
            <input
              id="amount"
              type="number"
              min="0.01"
              step="0.01"
              placeholder="0.00"
              required
            >
          </div>

          <div class="field">
            <label for="date">Date</label>
            <input id="date" type="date" required>
          </div>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option>Food</option>
            <option>Transport</option>
            <option>Bills</option>
            <option>Shopping</option>
            <option>Health</option>
            <option>Other</option>
          </select>
        </div>

        <button type="submit">Add expense</button>
      </form>
    </section>

    <section class="panel">
      <div class="list-heading">
        <h2>Recent expenses</h2>
        <select id="filter" aria-label="Filter expenses by category">
          <option value="All">All categories</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Shopping</option>
          <option>Health</option>
          <option>Other</option>
        </select>
      </div>
      <ul id="expense-list"></ul>
    </section>
  </main>

</body>
</html>
