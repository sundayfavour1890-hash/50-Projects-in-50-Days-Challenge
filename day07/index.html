<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today — To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo">
    <p class="eyebrow">Make space for what matters</p>
    <h1>Today.</h1>
    <p class="intro">A little clarity, one task at a time.</p>
    <h2>My tasks</h2>
    <ul>
      <li><label><input type="checkbox"><span>Plan the day</span></label></li>
      <li><label><input type="checkbox"><span>Reply to important emails</span></label></li>
      <li><label><input type="checkbox"><span>Take a short walk</span></label></li>
      <li><label><input type="checkbox"><span>Read for 20 minutes</span></label></li>
    </ul>
    <p class="note">Check a task to mark it complete.</p>
  </main>
</body>
</html>
