<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stopwatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stopwatch">
    <h1>Stopwatch</h1>
    <input type="checkbox" id="running">
    <div class="clock">
      <div class="hand"></div>
      <div class="center"></div>
    </div>
    <label for="running">Start / Pause</label>
  </main>
</body>
</html>
