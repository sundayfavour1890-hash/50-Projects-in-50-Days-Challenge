<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>NewsHub | Latest World News</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <nav class="navbar">
      <h1 class="logo">News<span>Hub</span></h1>

      <div class="nav-actions">
        <button id="themeBtn" aria-label="Toggle dark mode">
          🌙
        </button>
      </div>
    </nav>

    <section class="hero">
      <h2>Stay Updated With The Latest News</h2>
      <p>
        Breaking news, trending stories, and updates
        from around the world.
      </p>

      <form id="searchForm" class="search-box">
        <input
          type="search"
          id="searchInput"
          placeholder="Search for news..."
          aria-label="Search news"
          required
        >
        <button type="submit">Search</button>
      </form>
    </section>
  </header>

  <!-- MAIN CONTENT -->
  <main>

    <!-- NEWS CATEGORIES -->
    <section class="categories">
      <button class="category active" data-category="all">
        All News
      </button>

      <button class="category" data-category="business">
        Business
      </button>

      <button class="category" data-category="technology">
        Technology
      </button>

      <button class="category" data-category="sport">
        Sports
      </button>

      <button class="category" data-category="culture">
        Entertainment
      </button>

      <button class="category" data-category="society">
        Society
      </button>

      <button class="category" data-category="science">
        Science
      </button>
    </section>

    <!-- NEWS SECTION -->
    <section class="news-section">

      <div class="section-header">
        <h2 id="newsTitle">Latest Headlines</h2>
        <span id="newsCount"></span>
      </div>

      <p id="statusMessage" role="status"></p>

      <div id="newsContainer" class="news-grid">
      </div>

      <div class="load-more-container">
        <button id="loadMoreBtn" hidden>
          Load More News
        </button>
      </div>

    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <h2>News<span>Hub</span></h2>

    <p>Your trusted destination for global news.</p>

    <p>
      News content provided by The Guardian.
    </p>

    <p>&copy; 2026 NewsHub. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
