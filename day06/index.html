<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter App— 50 Days Challenge</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <p class="eyebrow">50 DAYS CHALLENGE / DAY 01</p>

      <section class="counter-card" aria-labelledby="title">
        <p class="label">INTERACTIVE PROJECT 01</p>
        <h1 id="title">The Counter<span>.</span></h1>
        <p class="subtitle">A little number, entirely in your hands.</p>

        <div class="display" aria-live="polite">
          <span id="count">0</span>
        </div>

        <div class="controls">
          <button id="decrement" type="button" aria-label="Decrease count">−</button>
          <button id="reset" type="button">Reset</button>
          <button id="increment" type="button" aria-label="Increase count">+</button>
        </div>

        <p class="hint">Tip: use your ← and → arrow keys</p>
      </section>

      <footer>50 DAYS CHALLENGE · HTML / CSS </footer>
    </main>
  </body>
</html>
