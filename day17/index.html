<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Image Gallery</h1>
    <p>A collection of beautiful places</p>
  </header>

  <main class="gallery">
    <figure>
      <img src="https://picsum.photos/seed/mountain-view/800/600"
           alt="Scenic mountain landscape">
      <figcaption>Mountain View</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/seed/quiet-forest/800/600"
           alt="Quiet forest scenery">
      <figcaption>Quiet Forest</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/seed/ocean-coast/800/600"
           alt="Ocean coast scenery">
      <figcaption>Ocean Coast</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/seed/city-lights/800/600"
           alt="City scenery">
      <figcaption>City Lights</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/seed/desert-sky/800/600"
           alt="Desert scenery">
      <figcaption>Desert Sky</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/seed/country-lake/800/600"
           alt="Lake scenery">
      <figcaption>Country Lake</figcaption>
    </figure>
  </main>
</body>
</html>
